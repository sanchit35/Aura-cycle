<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura Cycle Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #fafafa; }
        .cycle-card { transition: all 0.3s ease; }
        .cycle-card:hover { transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
        .gradient-bg { background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 99%, #fad0c4 100%); }
    </style>
</head>
<body class="p-6">
    <div class="max-w-md mx-auto">
        <header class="mb-8 flex justify-between items-center">
            <h1 class="text-3xl font-bold text-gray-800">Aura ⚡</h1>
            <button id="addPeriodBtn" class="bg-pink-500 text-white p-3 rounded-full shadow-lg font-bold">+</button>
        </header>

        <!-- Current Phase Dashboard -->
        <div class="gradient-bg rounded-3xl p-6 text-white mb-6 shadow-xl cycle-card">
            <p class="opacity-80 uppercase text-xs font-bold tracking-widest mb-1">Current Phase</p>
            <h2 id="currentPhase" class="text-2xl font-semibold mb-4">Follicular Phase</h2>
            <div class="bg-white/20 rounded-xl p-4">
                <p id="phaseAdvice" class="text-sm italic">"Your energy is rising. Great time for new projects and difficult workouts."</p>
            </div>
        </div>

        <!-- Stats Grid -->
        <div class="grid grid-cols-2 gap-4 mb-8">
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
                <p class="text-gray-400 text-xs uppercase font-bold">Next Period</p>
                <p id="nextDate" class="text-lg font-semibold text-gray-700">March 12</p>
            </div>
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
                <p class="text-gray-400 text-xs uppercase font-bold">Avg Cycle</p>
                <p id="avgCycle" class="text-lg font-semibold text-gray-700">28 Days</p>
            </div>
        </div>

        <!-- Symptoms & Logs -->
        <h3 class="text-lg font-semibold text-gray-800 mb-4">Wellness Logs</h3>
        <div id="logs" class="space-y-4">
            <!-- Items will be injected here -->
        </div>
    </div>

    <script>
        async function updateUI() {
            const res = await fetch('/api/status');
            const data = await res.json();
            document.getElementById('currentPhase').innerText = data.phase;
            document.getElementById('nextDate').innerText = data.next;
        }

        document.getElementById('addPeriodBtn').onclick = async () => {
            const date = prompt("Enter Start Date (YYYY-MM-DD):", new Date().toISOString().split('T')[0]);
            if (!date) return;
            await fetch('/api/add', {
                method: 'POST',
                body: JSON.stringify({ date, duration: 5 })
            });
            updateUI();
        };

        updateUI();
    </script>
</body>
</html>
