<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #fafafa; }
        .gradient-bg { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .phase-menstrual { background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%); }
        .phase-follicular { background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%); }
        .phase-ovulatory { background: linear-gradient(135deg, #84fab0 0%, #8fd3f4 100%); }
        .phase-luteal { background: linear-gradient(135deg, #fccb90 0%, #d57eeb 100%); }
    </style>
</head>
<body class="p-6">
    <div class="max-w-md mx-auto">
        <header class="mb-8 flex justify-between items-center">
            <h1 class="text-3xl font-black text-gray-900 tracking-tighter italic">AURA<span class="text-pink-500">.</span></h1>
            <button id="addPeriodBtn" class="bg-black text-white w-12 h-12 rounded-2xl shadow-xl font-bold text-2xl">+</button>
        </header>

        <div id="phaseCard" class="rounded-3xl p-8 text-white mb-6 shadow-2xl transition-all duration-500">
            <p class="opacity-70 uppercase text-xs font-black tracking-widest mb-2">Current Phase</p>
            <h2 id="currentPhase" class="text-3xl font-black mb-4 leading-none">Loading...</h2>
            <div class="bg-black/10 backdrop-blur-md rounded-2xl p-4">
                <p id="advice" class="text-sm font-medium leading-relaxed italic"></p>
            </div>
        </div>

        <div class="grid grid-cols-2 gap-4 mb-6">
            <div class="bg-white p-6 rounded-3xl shadow-sm border border-gray-100">
                <p class="text-gray-400 text-[10px] uppercase font-black mb-1">Next Cycle</p>
                <p id="nextDate" class="text-xl font-black text-gray-900">--</p>
            </div>
            <div class="bg-white p-6 rounded-3xl shadow-sm border border-gray-100">
                <p class="text-gray-400 text-[10px] uppercase font-black mb-1">Fertility</p>
                <p id="pregChance" class="text-xl font-black text-pink-500">Low</p>
            </div>
        </div>

        <h3 class="text-xs font-black text-gray-400 uppercase tracking-widest mb-4">Aura Intelligence</h3>
        <div class="space-y-3">
            <div class="bg-white p-5 rounded-3xl shadow-sm border border-gray-100 flex items-center gap-4">
                <div class="text-2xl">💪</div>
                <div>
                    <p class="text-[10px] font-black uppercase text-gray-400">Workout</p>
                    <p id="workoutAdvice" class="text-sm font-bold text-gray-800">Loading...</p>
                </div>
            </div>
            <div class="bg-white p-5 rounded-3xl shadow-sm border border-gray-100 flex items-center gap-4">
                <div class="text-2xl">🥗</div>
                <div>
                    <p class="text-[10px] font-black uppercase text-gray-400">Nutrition</p>
                    <p id="dietAdvice" class="text-sm font-bold text-gray-800">Loading...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        const phaseData = {
            'Menstrual': {
                class: 'phase-menstrual',
                advice: 'Your hormones are at their lowest. Prioritize rest and iron-rich foods.',
                workout: 'Gentle stretching or restorative yoga.',
                diet: 'Red meat, spinach, dark chocolate.',
                preg: 'Low'
            },
            'Follicular': {
                class: 'phase-follicular',
                advice: 'Oestrogen is rising. You are becoming more creative and socially open.',
                workout: 'Light cardio or new skill learning.',
                diet: 'Fermented foods, avocados, salads.',
                preg: 'Medium'
            },
            'Ovulatory': {
                class: 'phase-ovulatory',
                advice: 'The peak of your cycle. Your confidence and libido are at their highest.',
                workout: 'High-intensity (HIIT) or strength training.',
                diet: 'Lean proteins, quinoa, plenty of water.',
                preg: 'HIGH'
            },
            'Luteal': {
                class: 'phase-luteal',
                advice: 'Progesterone is dominant. You may feel more introverted or prone to PMS.',
                workout: 'Resistance training or Pilates.',
                diet: 'Complex carbs, sweet potatoes, magnesium.',
                preg: 'Low'
            }
        };

        async function updateUI() {
            const res = await fetch('/api/status');
            const data = await res.json();
            const phaseKey = data.phase.split(' ')[0];
            const meta = phaseData[phaseKey] || phaseData['Menstrual'];

            const card = document.getElementById('phaseCard');
            card.className = `rounded-3xl p-8 text-white mb-6 shadow-2xl transition-all duration-500 ${meta.class}`;
            
            document.getElementById('currentPhase').innerText = data.phase;
            document.getElementById('nextDate').innerText = data.next;
            document.getElementById('advice').innerText = `"${meta.advice}"`;
            document.getElementById('workoutAdvice').innerText = meta.workout;
            document.getElementById('dietAdvice').innerText = meta.diet;
            document.getElementById('pregChance').innerText = meta.preg;
        }

        document.getElementById('addPeriodBtn').onclick = async () => {
            const date = prompt("Enter Start Date (YYYY-MM-DD):", new Date().toISOString().split('T')[0]);
            if (!date) return;
            await fetch('/api/add', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ date, duration: 5 })
            });
            updateUI();
        };

        updateUI();
    </script>
</body>
</html>
